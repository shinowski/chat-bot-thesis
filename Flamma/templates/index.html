<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flamma — Symptom Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">SkiBot</span>
    </div>

    <button class="new-chat" id="newChatBtn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1V13M1 7H13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      New conversation
    </button>

    <div class="history-label">Recent</div>
    <div class="history" id="historyList"></div>

    <div class="sidebar-foot">
      <span class="dot-live"></span> dev build · rule-based engine
    </div>
  </aside>

  <main class="main">
    <div class="chat-header">
      <div>
        <div class="chat-title" id="chatTitle">New conversation</div>
        <div class="chat-sub">Describe what you're noticing — I'll ask a few follow-ups</div>
      </div>
      <div class="model-pill" id="modelPill">intent: —</div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <div id="attachment" hidden>
        <span id="attachmentName"></span>
        <button type="button" id="removeImageBtn">Remove image</button>
      </div>
      <div class="composer-inner">
        <input type="file" id="imageInput" accept="image/jpeg,image/png,image/webp" hidden>
        <button class="icon-btn" id="uploadImageBtn" title="Upload a skin photo">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><rect x="2.5" y="4" width="15" height="12" rx="2" stroke="currentColor" stroke-width="1.4"/><circle cx="7" cy="8.5" r="1.4" stroke="currentColor" stroke-width="1.4"/><path d="M4 14.5L8 10.5L11 13L14 10L16.5 12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Ask Flamma..."></textarea>
        <button class="send-btn" id="sendBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8H14M14 8L9 3M14 8L9 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="composer-note">Upload a JPG, PNG, or WebP skin photo, up to 10 MB.</div>
    </div>
  </main>

</div>

<script type="module" src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
